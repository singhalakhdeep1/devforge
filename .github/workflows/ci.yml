name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: shadow
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U ci" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      # builds the shared library first, then every service (prisma generate + tsc)
      - run: npm run build
      - name: Migrations match the Prisma schemas
        run: |
          for schema in backend/*/prisma/schema.prisma; do
            dir=$(dirname "$schema")
            echo "checking $dir"
            npx prisma migrate diff --from-migrations "$dir/migrations" --to-schema-datamodel "$schema" \
              --shadow-database-url postgresql://ci:ci@localhost:5432/shadow --exit-code
          done

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api

  deploy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose file is valid
        run: docker compose config -q
      - name: Kubernetes manifests render
        run: |
          cp k8s/secrets.example.env k8s/secrets.env
          kubectl kustomize k8s > /dev/null

  images:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: api-gateway, workspace: backend/api-gateway }
          - { name: auth-service, workspace: backend/auth-service }
          - { name: notification-service, workspace: backend/notification-service }
          - { name: email-service, workspace: backend/email-service }
          - { name: file-service, workspace: backend/file-service }
          - { name: analytics-service, workspace: backend/analytics-service }
          - { name: websocket-service, workspace: websocket-server }
          - { name: course-service, workspace: backend/course-service }
          - { name: editor-service, workspace: backend/editor-service }
          - { name: kanban-service, workspace: backend/kanban-service }
          - { name: payment-service, workspace: backend/payment-service }
          - { name: video-service, workspace: backend/video-service }
          - { name: search-service, workspace: backend/search-service }
          - { name: project-service, workspace: backend/project-service }
          - { name: audit-service, workspace: backend/audit-service }
          - { name: reporting-service, workspace: backend/reporting-service }
          - { name: backup-service, workspace: backend/backup-service, db_tools: "true" }
          - { name: monitoring-service, workspace: backend/monitoring-service }
          - { name: elasticsearch-service, workspace: backend/elasticsearch-service }
          - { name: graphql-service, workspace: backend/graphql-api, deps: "backend/shared backend/graphql-subscriptions" }
          - { name: grpc-service, workspace: backend/grpc-api }
          - { name: trpc-service, workspace: backend/trpc-api }
          - { name: kafka-service, workspace: backend/kafka-service }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/service.Dockerfile
          build-args: |
            SERVICE=${{ matrix.workspace }}
            DEPS=${{ matrix.deps || 'backend/shared' }}
            DB_TOOLS=${{ matrix.db_tools || 'false' }}
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository_owner }}/devforge-${{ matrix.name }}:${{ github.sha }},ghcr.io/${{ github.repository_owner }}/devforge-${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  frontend-image:
    needs: [frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository_owner }}/devforge-frontend:${{ github.sha }},ghcr.io/${{ github.repository_owner }}/devforge-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
