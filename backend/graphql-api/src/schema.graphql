# DevForge GraphQL API (http://<gateway>/graphql). Queries and mutations call the owning services
# with the caller's identity, so every permission rule of those services applies unchanged.
# Subscriptions are defined in backend/graphql-subscriptions/src/schema.graphql.
# Large nested objects keep their full service representation in a `raw: JSON` field.

scalar DateTime

type Query {
  # people
  me: User
  user(id: ID!): User
  users(filter: UserFilter, limit: Int, offset: Int): UserConnection!

  # kanban
  board(id: ID!): Board
  boards(projectId: ID, filter: BoardFilter): [Board!]!
  task(id: ID!): Task
  tasks(boardId: ID!, filter: TaskFilter): [Task!]!
  myTasks(filter: TaskFilter): [Task!]!
  sprints(boardId: ID!): [Sprint!]!
  boardAnalytics(boardId: ID!): BoardAnalytics!
  burndown(sprintId: ID!): JSON
  searchTasks(query: String!, boardId: ID!, limit: Int): [Task!]!

  # learning
  courses(search: String, category: String, level: String, page: Int, pageSize: Int): CourseConnection!
  course(id: ID!): Course
  myCourses: [Course!]!
  dashboard: JSON

  # projects and documents
  projects(search: String, page: Int, pageSize: Int): ProjectConnection!
  project(id: ID!): Project
  documents: [Document!]!
  document(id: ID!): Document

  # everything else
  search(query: String!, type: SearchType): SearchResult!
  notifications(limit: Int, offset: Int): NotificationConnection!
  unreadNotificationsCount: Int!
  onlineUsers: [OnlineUser!]!
  analyticsOverview(days: Int): JSON
}

type Mutation {
  updateProfile(input: UpdateProfileInput!): User!

  createBoard(input: CreateBoardInput!): Board!
  updateBoard(id: ID!, input: UpdateBoardInput!): Board!
  deleteBoard(id: ID!): Boolean!

  createColumn(input: CreateColumnInput!): Column!
  updateColumn(id: ID!, input: UpdateColumnInput!): Column!
  deleteColumn(id: ID!, moveTo: ID): Boolean!
  reorderColumns(boardId: ID!, columnIds: [ID!]!): Boolean!

  createTask(input: CreateTaskInput!): Task!
  updateTask(id: ID!, input: UpdateTaskInput!): Task!
  deleteTask(id: ID!): Boolean!
  moveTask(id: ID!, columnId: ID!, order: Int): Task!
  assignTask(id: ID!, userId: ID!): Task!
  unassignTask(id: ID!): Task!
  addTaskLabel(taskId: ID!, labelId: ID!): Boolean!
  removeTaskLabel(taskId: ID!, labelId: ID!): Boolean!
  addTaskToSprint(taskId: ID!, sprintId: ID!): Task!
  removeTaskFromSprint(taskId: ID!): Task!
  watchTask(taskId: ID!): Boolean!
  unwatchTask(taskId: ID!): Boolean!
  addComment(taskId: ID!, body: String!): JSON

  createSprint(input: CreateSprintInput!): Sprint!
  startSprint(id: ID!): Sprint!
  completeSprint(id: ID!, moveIncompleteTo: String): Sprint!
  createLabel(input: CreateLabelInput!): Label!

  enroll(courseId: ID!): Boolean!
  createProject(input: CreateProjectInput!): Project!
  starProject(id: ID!): Boolean!
  createDocument(title: String!, language: String): Document!
  updateDocument(id: ID!, title: String, visibility: String): Document!
  deleteDocument(id: ID!): Boolean!

  markNotificationRead(id: ID!): Boolean!
  markAllNotificationsRead: Int!
}

enum SearchType { all courses users projects }

input UserFilter { search: String, role: String }
input BoardFilter { archived: Boolean }
input TaskFilter { q: String, assignee: String, label: ID, priority: String, sprint: ID }
input UpdateProfileInput { name: String, bio: String, location: String, website: String }
input CreateBoardInput { projectId: ID!, name: String!, description: String }
input UpdateBoardInput { name: String, description: String, visibility: String, archived: Boolean }
input CreateColumnInput { boardId: ID!, name: String!, color: String, status: String, wipLimit: Int }
input UpdateColumnInput { name: String, color: String, status: String, wipLimit: Int }
input CreateTaskInput { boardId: ID!, columnId: ID!, title: String!, description: String, type: String, priority: String, assigneeId: ID, sprintId: ID, epicId: ID, points: Int, dueDate: DateTime, labelIds: [ID!] }
input UpdateTaskInput { title: String, description: String, type: String, priority: String, assigneeId: ID, sprintId: ID, epicId: ID, points: Int, dueDate: DateTime }
input CreateSprintInput { boardId: ID!, name: String!, goal: String, startDate: DateTime!, endDate: DateTime! }
input CreateLabelInput { boardId: ID!, name: String!, color: String! }
input CreateProjectInput { name: String!, description: String, visibility: String, tags: [String!] }

type User { id: ID!, name: String, email: String, role: String, avatar: String, bio: String, createdAt: String, raw: JSON }
type UserConnection { nodes: [User!]!, total: Int! }
type OnlineUser { userId: ID!, name: String }

type Board { id: ID!, projectId: ID, name: String!, description: String, visibility: String, archived: Boolean, columns: [Column!]!, tasks: [Task!]!, sprints: [Sprint!]!, labels: [Label!]!, access: JSON, raw: JSON }
type Column { id: ID!, name: String!, color: String, status: String, wipLimit: Int, order: Int, taskCount: Int }
type Task { id: ID!, boardId: ID, columnId: ID, title: String!, description: String, type: String, priority: String, status: String, points: Int, dueDate: String, assigneeId: ID, assignee: JSON, sprintId: ID, labels: JSON, order: Float, createdAt: String, updatedAt: String, raw: JSON }
type Sprint { id: ID!, boardId: ID, name: String!, goal: String, status: String, startDate: String, endDate: String, raw: JSON }
type Label { id: ID!, name: String!, color: String }
type BoardAnalytics { boardId: ID!, data: JSON }

type Course { id: ID!, slug: String, title: String!, description: String, category: String, level: String, price: Float, rating: Float, ratingCount: Int, students: Int, lessonCount: Int, raw: JSON }
type CourseConnection { nodes: [Course!]!, total: Int!, page: Int, totalPages: Int }

type Project { id: ID!, slug: String, name: String!, description: String, visibility: String, stars: Int, tags: [String!], raw: JSON }
type ProjectConnection { nodes: [Project!]!, total: Int!, page: Int, totalPages: Int }

type Document { id: ID!, title: String!, language: String, visibility: String, ownerId: ID, access: String, updatedAt: String, raw: JSON }

type SearchResult { query: String, courses: JSON, instructors: JSON, projects: JSON, didYouMean: String }

type Notification { id: ID!, type: String, title: String, message: String, link: String, read: Boolean!, createdAt: String }
type NotificationConnection { nodes: [Notification!]!, unread: Int! }
