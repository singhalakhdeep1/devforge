# GraphQL Subscriptions schema for devforge

type Subscription {
  # Document updates
  documentUpdated(documentId: ID!): DocumentUpdate!
  documentCreated(userId: ID!): Document!
  
  # Kanban updates
  cardAdded(boardId: ID!): Card!
  cardUpdated(cardId: ID!): Card!
  cardDeleted(cardId: ID!): ID!
  
  # Notifications
  notificationReceived(userId: ID!): Notification!
  
  # Analytics updates
  analyticsUpdated(userId: ID!): Analytics!
  
  # User presence
  userOnline(userId: ID!): UserPresence!
  userOffline(userId: ID!): UserPresence!
}

type DocumentUpdate {
  documentId: ID!
  title: String!
  content: String!
  updatedAt: String!
  updatedBy: User!
}

type Document {
  id: ID!
  title: String!
  content: String!
  createdAt: String!
  updatedAt: String!
  author: User!
}

type Card {
  id: ID!
  title: String!
  description: String!
  columnId: ID!
  position: Int!
  createdAt: String!
  updatedAt: String!
}

type Notification {
  id: ID!
  userId: ID!
  message: String!
  type: String!
  read: Boolean!
  createdAt: String!
}

type Analytics {
  userId: ID!
  pageViews: Int!
  uniqueVisitors: Int!
  bounceRate: Float!
  avgSessionDuration: Int!
  updatedAt: String!
}

type UserPresence {
  userId: ID!
  status: String!
  lastSeen: String!
  currentDocument: String
}

type User {
  id: ID!
  email: String!
  name: String!
  avatar: String
}
