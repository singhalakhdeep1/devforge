# Live updates for DevForge, served by graphql-api over graphql-ws (ws://<gateway>/graphql).
# Every subscription checks access: you only receive events for boards and documents you can see,
# and only your own notifications.

scalar JSON

type Subscription {
  "Changes to a document you can view (title, visibility, deletion)."
  documentUpdated(documentId: ID!): DocumentUpdate!
  "Documents created by a user (only your own userId is allowed)."
  documentCreated(userId: ID!): DocumentUpdate!

  "Kanban: a card was created on a board you can view."
  cardAdded(boardId: ID!): Card!
  "Kanban: a card on the board was edited or moved."
  cardUpdated(boardId: ID!, cardId: ID): Card!
  "Kanban: a card was deleted; returns its id."
  cardDeleted(boardId: ID!): ID!
  "Kanban: every live event on a board (cards, columns, comments, sprints)."
  boardEvents(boardId: ID!): BoardEvent!

  "Notifications for the signed-in user (userId must be your own)."
  notificationReceived(userId: ID!): SubscriptionNotification!

  "Analytics events as they are tracked (admins only)."
  analyticsUpdated(userId: ID): AnalyticsEvent!

  "Presence: a user came online / went offline (any user, or one user when userId is given)."
  userOnline(userId: ID): UserPresence!
  userOffline(userId: ID): UserPresence!
}

type DocumentUpdate {
  documentId: ID!
  action: String!
  title: String
  ownerId: ID
  updatedBy: ID
  updatedAt: String!
}

type Card {
  id: ID!
  boardId: ID!
  title: String
  description: String
  columnId: ID
  position: Float
  priority: String
  assigneeId: ID
  updatedAt: String
  raw: JSON
}

type BoardEvent {
  boardId: ID!
  type: String!
  payload: JSON
}

type SubscriptionNotification {
  id: ID!
  userId: ID!
  type: String
  title: String
  message: String
  link: String
  read: Boolean!
  createdAt: String
}

type AnalyticsEvent {
  userId: ID
  type: String!
  name: String
  path: String
  properties: JSON
  at: String!
}

type UserPresence {
  userId: ID!
  name: String
  status: String!
  lastSeen: String!
}
