syntax = "proto3";

// DevForge gRPC API. Calls are authenticated with metadata `authorization: Bearer <access token>`
// (Auth.Login / Auth.Register excepted) and served by the owning services, with their permissions.
// Fields added after the first version use new numbers, so older clients keep working.
package devforge;

// Analytics service
service Analytics {
  rpc GetAnalytics(GetAnalyticsRequest) returns (GetAnalyticsResponse);
}

message GetAnalyticsRequest {
  string userId = 1;     // empty or your own id (only your own activity is readable)
  string startDate = 2;  // YYYY-MM-DD, default 30 days ago
  string endDate = 3;    // YYYY-MM-DD, default today
}

message GetAnalyticsResponse {
  string userId = 1;
  int32 pageViews = 2;
  int32 uniqueVisitors = 3;    // days with activity in the range
  double bounceRate = 4;       // not tracked by DevForge: always 0
  int32 avgSessionDuration = 5; // not tracked by DevForge: always 0
  string json = 6;             // the full statistics from analytics-service
}

// Editor service
service Editor {
  rpc SaveDocument(SaveDocumentRequest) returns (SaveDocumentResponse);
  rpc GetDocument(GetDocumentRequest) returns (GetDocumentResponse);
}

message SaveDocumentRequest {
  string documentId = 1; // empty: create a new document
  string content = 2;
  string title = 3;
  string language = 4;
}

message SaveDocumentResponse {
  bool success = 1;
  string documentId = 2;
  string savedAt = 3;
}

message GetDocumentRequest {
  string documentId = 1;
}

message GetDocumentResponse {
  string documentId = 1;
  string title = 2;
  string content = 3;
  string updatedAt = 4;
  string language = 5;
  string access = 6;
}

// Kanban service
service Kanban {
  rpc GetBoard(GetBoardRequest) returns (GetBoardResponse);
  rpc CreateCard(CreateCardRequest) returns (CreateCardResponse);
}

message GetBoardRequest {
  string boardId = 1;
}

message GetBoardResponse {
  string boardId = 1;
  string name = 2;
  repeated Column columns = 3;
  repeated Card cards = 4;
}

message Column {
  string id = 1;
  string name = 2;
  int32 taskCount = 3;
  int32 wipLimit = 4;
}

message Card {
  string id = 1;
  string columnId = 2;
  string title = 3;
  string priority = 4;
  string assigneeId = 5;
}

message CreateCardRequest {
  string columnId = 1;
  string title = 2;
  string description = 3;
  string boardId = 4;
  string priority = 5;
}

message CreateCardResponse {
  bool success = 1;
  string cardId = 2;
  string columnId = 3;
}

// Auth service
service Auth {
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc Register(RegisterRequest) returns (RegisterResponse);
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  bool success = 1;
  string token = 2;
  User user = 3;
  bool requires2FA = 4;
  string challengeToken = 5;
}

message User {
  string id = 1;
  string email = 2;
  string name = 3;
  string role = 4;
}

message RegisterRequest {
  string email = 1;
  string password = 2;
  string name = 3;
}

message RegisterResponse {
  bool success = 1;
  string userId = 2;
  string email = 3;
  string name = 4;
  string token = 5;
}
