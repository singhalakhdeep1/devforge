# The gateway is the only public API entry point (its Deployment and Service are in deployments/ and
# services/). It scales with load and keeps at least one replica through node maintenance.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: api-gateway }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: api-gateway }
---
# the busiest services scale the same way
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: course-service
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: course-service }
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: websocket-service
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: websocket-service }
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
