# Next.js web app (frontend/Dockerfile). NEXT_PUBLIC_API_URL is baked in at image build time.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels: { app: frontend, app.kubernetes.io/part-of: devforge }
spec:
  replicas: 2
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend, app.kubernetes.io/part-of: devforge }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1000 }
      containers:
        - name: frontend
          image: devforge/frontend:latest
          ports: [{ containerPort: 3000, name: http }]
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector: { app: frontend }
  ports: [{ name: http, port: 3000, targetPort: http }]
