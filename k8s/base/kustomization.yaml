apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: devhub-production

# Common labels applied to all resources
commonLabels:
  app.kubernetes.io/name: devhub
  app.kubernetes.io/managed-by: kustomize
  app.kubernetes.io/version: "1.0.0"

# Common annotations
commonAnnotations:
  contact: "devops@devhub.com"
  documentation: "https://docs.devhub.com"

resources:
  - namespace.yaml
  - api-gateway.yaml
  - auth-service.yaml
  - email-service.yaml
  - notification-service.yaml
  - file-service.yaml
  - analytics-service.yaml
  - search-service.yaml
  - video-service.yaml
  - editor-service.yaml
  - payment-service.yaml
  - kanban-service.yaml
  - graphql-api.yaml
  - websocket-server.yaml
  - frontend.yaml
  - postgres.yaml
  - mongodb.yaml
  - redis.yaml
  - elasticsearch.yaml

configMapGenerator:
  - name: devhub-config
    literals:
      - NODE_ENV=production
      - LOG_LEVEL=info
      - CORS_ORIGIN=https://devhub.com

secretGenerator:
  - name: devhub-secrets
    envs:
      - secrets.env

# Images to use
images:
  - name: devhub/api-gateway
    newTag: latest
  - name: devhub/auth-service
    newTag: latest
  - name: devhub/frontend
    newTag: latest

# Replicas for all services
replicas:
  - name: api-gateway
    count: 3
  - name: auth-service
    count: 3
  - name: email-service
    count: 2
  - name: notification-service
    count: 2
  - name: file-service
    count: 3
  - name: analytics-service
    count: 2
  - name: search-service
    count: 2
  - name: video-service
    count: 3
  - name: editor-service
    count: 3
  - name: payment-service
    count: 2
  - name: kanban-service
    count: 2
  - name: graphql-api
    count: 2
  - name: websocket-server
    count: 3
  - name: frontend
    count: 3
