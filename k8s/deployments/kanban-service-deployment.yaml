apiVersion: apps/v1
kind: Deployment
metadata:
  name: kanban-service
  labels:
    app: kanban-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kanban-service
  template:
    metadata:
      labels:
        app: kanban-service
    spec:
      containers:
      - name: kanban-service
        image: devforge/kanban-service:latest
        ports:
        - containerPort: 3011
        envFrom:
        - configMapRef:
            name: kanban-service-config
        - secretRef:
            name: kanban-service-secrets
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 3011
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3011
          initialDelaySeconds: 5
          periodSeconds: 5
