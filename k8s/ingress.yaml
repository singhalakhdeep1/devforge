apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devforge-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
  - host: devforge.local
    http:
      paths:
      - path: /api/auth
        pathType: Prefix
        backend:
          service:
            name: auth-service
            port:
              number: 4001
      - path: /api/notify
        pathType: Prefix
        backend:
          service:
            name: notification-service
            port:
              number: 4002
      - path: /api/kanban
        pathType: Prefix
        backend:
          service:
            name: kanban-service
            port:
              number: 3011
