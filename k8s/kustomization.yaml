# kubectl apply -k k8s   (after creating k8s/secrets.env from secrets.example.env and pushing the images)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: devforge

labels:
  - pairs: { app.kubernetes.io/managed-by: kustomize }

resources:
  - base
  - ingress.yaml
  - deployments/api-gateway-deployment.yaml
  - services/api-gateway-service.yaml
  - deployments/auth-service-deployment.yaml
  - services/auth-service-service.yaml
  - deployments/notification-service-deployment.yaml
  - services/notification-service-service.yaml
  - deployments/email-service-deployment.yaml
  - services/email-service-service.yaml
  - deployments/file-service-deployment.yaml
  - services/file-service-service.yaml
  - deployments/analytics-service-deployment.yaml
  - services/analytics-service-service.yaml
  - deployments/websocket-service-deployment.yaml
  - services/websocket-service-service.yaml
  - deployments/course-service-deployment.yaml
  - services/course-service-service.yaml
  - deployments/editor-service-deployment.yaml
  - services/editor-service-service.yaml
  - deployments/kanban-service-deployment.yaml
  - services/kanban-service-service.yaml
  - deployments/payment-service-deployment.yaml
  - services/payment-service-service.yaml
  - deployments/video-service-deployment.yaml
  - services/video-service-service.yaml
  - deployments/search-service-deployment.yaml
  - services/search-service-service.yaml
  - deployments/project-service-deployment.yaml
  - services/project-service-service.yaml
  - deployments/audit-service-deployment.yaml
  - services/audit-service-service.yaml
  - deployments/reporting-service-deployment.yaml
  - services/reporting-service-service.yaml
  - deployments/backup-service-deployment.yaml
  - services/backup-service-service.yaml
  - deployments/monitoring-service-deployment.yaml
  - services/monitoring-service-service.yaml
  - deployments/elasticsearch-service-deployment.yaml
  - services/elasticsearch-service-service.yaml
  - deployments/graphql-service-deployment.yaml
  - services/graphql-service-service.yaml
  - deployments/grpc-service-deployment.yaml
  - services/grpc-service-service.yaml
  - deployments/trpc-service-deployment.yaml
  - services/trpc-service-service.yaml
  - deployments/kafka-service-deployment.yaml
  - services/kafka-service-service.yaml

secretGenerator:
  - name: devforge-secrets
    envs: [secrets.env]
    options: { disableNameSuffixHash: true }

images:
  - name: devforge/api-gateway
    newTag: latest
  - name: devforge/auth-service
    newTag: latest
  - name: devforge/notification-service
    newTag: latest
  - name: devforge/email-service
    newTag: latest
  - name: devforge/file-service
    newTag: latest
  - name: devforge/analytics-service
    newTag: latest
  - name: devforge/websocket-service
    newTag: latest
  - name: devforge/course-service
    newTag: latest
  - name: devforge/editor-service
    newTag: latest
  - name: devforge/kanban-service
    newTag: latest
  - name: devforge/payment-service
    newTag: latest
  - name: devforge/video-service
    newTag: latest
  - name: devforge/search-service
    newTag: latest
  - name: devforge/project-service
    newTag: latest
  - name: devforge/audit-service
    newTag: latest
  - name: devforge/reporting-service
    newTag: latest
  - name: devforge/backup-service
    newTag: latest
  - name: devforge/monitoring-service
    newTag: latest
  - name: devforge/elasticsearch-service
    newTag: latest
  - name: devforge/graphql-service
    newTag: latest
  - name: devforge/grpc-service
    newTag: latest
  - name: devforge/trpc-service
    newTag: latest
  - name: devforge/kafka-service
    newTag: latest
  - name: devforge/frontend
    newTag: latest
