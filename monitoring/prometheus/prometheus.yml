# Scrapes /metrics of every DevForge service (hostnames as in docker-compose.yml; in Kubernetes the
# Service names are the same). Alerting itself is done by monitoring-service, which reads the same
# endpoints; these rules are for dashboards and an optional Alertmanager.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: devforge

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: api-gateway
    metrics_path: /metrics
    static_configs:
      - targets: [gateway:4000]
        labels: { service: api-gateway, tier: gateway }

  - job_name: auth-service
    metrics_path: /metrics
    static_configs:
      - targets: [auth:4001]
        labels: { service: auth-service, tier: backend }

  - job_name: notification-service
    metrics_path: /metrics
    static_configs:
      - targets: [notification:4002]
        labels: { service: notification-service, tier: backend }

  - job_name: email-service
    metrics_path: /metrics
    static_configs:
      - targets: [email:4003]
        labels: { service: email-service, tier: backend }

  - job_name: file-service
    metrics_path: /metrics
    static_configs:
      - targets: [file:4004]
        labels: { service: file-service, tier: backend }

  - job_name: analytics-service
    metrics_path: /metrics
    static_configs:
      - targets: [analytics:4005]
        labels: { service: analytics-service, tier: backend }

  - job_name: websocket-service
    metrics_path: /metrics
    static_configs:
      - targets: [websocket:4006]
        labels: { service: websocket-service, tier: realtime }

  - job_name: course-service
    metrics_path: /metrics
    static_configs:
      - targets: [course:4007]
        labels: { service: course-service, tier: backend }

  - job_name: editor-service
    metrics_path: /metrics
    static_configs:
      - targets: [editor:4008]
        labels: { service: editor-service, tier: realtime }

  - job_name: kanban-service
    metrics_path: /metrics
    static_configs:
      - targets: [kanban:4009]
        labels: { service: kanban-service, tier: backend }

  - job_name: payment-service
    metrics_path: /metrics
    static_configs:
      - targets: [payment:4010]
        labels: { service: payment-service, tier: backend }

  - job_name: video-service
    metrics_path: /metrics
    static_configs:
      - targets: [video:4011]
        labels: { service: video-service, tier: realtime }

  - job_name: search-service
    metrics_path: /metrics
    static_configs:
      - targets: [search:4012]
        labels: { service: search-service, tier: backend }

  - job_name: project-service
    metrics_path: /metrics
    static_configs:
      - targets: [project:4013]
        labels: { service: project-service, tier: backend }

  - job_name: audit-service
    metrics_path: /metrics
    static_configs:
      - targets: [audit:4014]
        labels: { service: audit-service, tier: backend }

  - job_name: reporting-service
    metrics_path: /metrics
    static_configs:
      - targets: [reporting:4015]
        labels: { service: reporting-service, tier: backend }

  - job_name: backup-service
    metrics_path: /metrics
    static_configs:
      - targets: [backup:4016]
        labels: { service: backup-service, tier: operations }

  - job_name: monitoring-service
    metrics_path: /metrics
    static_configs:
      - targets: [monitoring:4017]
        labels: { service: monitoring-service, tier: operations }

  - job_name: elasticsearch-service
    metrics_path: /metrics
    static_configs:
      - targets: [elasticsearch-service:4018]
        labels: { service: elasticsearch-service, tier: operations }

  - job_name: graphql-service
    metrics_path: /metrics
    static_configs:
      - targets: [graphql:4020]
        labels: { service: graphql-service, tier: api }

  - job_name: grpc-service
    metrics_path: /metrics
    static_configs:
      - targets: [grpc:4021]
        labels: { service: grpc-service, tier: api }

  - job_name: trpc-service
    metrics_path: /metrics
    static_configs:
      - targets: [trpc:4022]
        labels: { service: trpc-service, tier: api }

  - job_name: kafka-service
    metrics_path: /metrics
    static_configs:
      - targets: [kafka-service:4023]
        labels: { service: kafka-service, tier: operations }
