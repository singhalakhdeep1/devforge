groups:
  - name: devhub_alerts
    interval: 30s
    rules:
      # High error rate
      - alert: HighErrorRate
        expr: |
          (
            sum(rate(http_requests_total{status_code=~"5.."}[5m])) by (service)
            /
            sum(rate(http_requests_total[5m])) by (service)
          ) > 0.05
        for: 5m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "High error rate on {{ $labels.service }}"
          description: "{{ $labels.service }} has error rate of {{ $value | humanizePercentage }} (threshold: 5%)"

      # Service down
      - alert: ServiceDown
        expr: up{job=~".*-service|api-gateway|frontend"} == 0
        for: 2m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "{{ $labels.job }} has been down for more than 2 minutes"

      # High response time
      - alert: HighResponseTime
        expr: |
          histogram_quantile(0.95, 
            sum(rate(http_request_duration_seconds_bucket[5m])) by (service, le)
          ) > 2
        for: 10m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "High response time on {{ $labels.service }}"
          description: "95th percentile response time is {{ $value }}s (threshold: 2s)"

      # High CPU usage
      - alert: HighCPUUsage
        expr: |
          100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 10m
        labels:
          severity: warning
          category: resources
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage is {{ $value | humanize }}% (threshold: 80%)"

      # High memory usage
      - alert: HighMemoryUsage
        expr: |
          (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 10m
        labels:
          severity: warning
          category: resources
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory usage is {{ $value | humanize }}% (threshold: 85%)"

      # Database connection pool exhaustion
      - alert: DatabaseConnectionPoolExhaustion
        expr: |
          (
            sum(pg_stat_database_numbackends) by (datname)
            /
            sum(pg_settings_max_connections) by (datname)
          ) > 0.8
        for: 5m
        labels:
          severity: warning
          category: database
        annotations:
          summary: "Database {{ $labels.datname }} connection pool near exhaustion"
          description: "Connection pool usage is {{ $value | humanizePercentage }} (threshold: 80%)"

      # Redis connection issues
      - alert: RedisConnectionFailed
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
          category: cache
        annotations:
          summary: "Redis connection failed"
          description: "Cannot connect to Redis instance {{ $labels.instance }}"

      # Elasticsearch cluster health
      - alert: ElasticsearchClusterRed
        expr: elasticsearch_cluster_health_status{color="red"} == 1
        for: 2m
        labels:
          severity: critical
          category: search
        annotations:
          summary: "Elasticsearch cluster is RED"
          description: "Elasticsearch cluster health is RED - data loss possible"

      # High disk usage
      - alert: HighDiskUsage
        expr: |
          (1 - (node_filesystem_avail_bytes{fstype!="tmpfs"} / node_filesystem_size_bytes)) * 100 > 85
        for: 10m
        labels:
          severity: warning
          category: storage
        annotations:
          summary: "High disk usage on {{ $labels.instance }}"
          description: "Disk usage is {{ $value | humanize }}% on {{ $labels.mountpoint }}"

      # SSL certificate expiration
      - alert: SSLCertificateExpiringSoon
        expr: |
          (probe_ssl_earliest_cert_expiry - time()) / 86400 < 30
        for: 1h
        labels:
          severity: warning
          category: security
        annotations:
          summary: "SSL certificate expiring soon"
          description: "SSL certificate for {{ $labels.instance }} expires in {{ $value }} days"

      # High request rate
      - alert: HighRequestRate
        expr: |
          sum(rate(http_requests_total[5m])) by (service) > 1000
        for: 5m
        labels:
          severity: info
          category: traffic
        annotations:
          summary: "High request rate on {{ $labels.service }}"
          description: "{{ $labels.service }} is receiving {{ $value }} requests/second"

      # Failed background jobs
      - alert: HighFailedJobRate
        expr: |
          (
            sum(rate(bullmq_jobs_failed_total[5m])) by (queue)
            /
            sum(rate(bullmq_jobs_completed_total[5m])) by (queue)
          ) > 0.1
        for: 10m
        labels:
          severity: warning
          category: jobs
        annotations:
          summary: "High failed job rate in {{ $labels.queue }}"
          description: "Failed job rate is {{ $value | humanizePercentage }} (threshold: 10%)"

      # WebSocket connection issues
      - alert: HighWebSocketDisconnectionRate
        expr: |
          rate(websocket_disconnections_total[5m]) > 10
        for: 5m
        labels:
          severity: warning
          category: realtime
        annotations:
          summary: "High WebSocket disconnection rate"
          description: "WebSocket disconnection rate is {{ $value }}/s (threshold: 10/s)"

      # Payment processing failures
      - alert: PaymentProcessingFailures
        expr: |
          rate(payment_processing_failed_total[5m]) > 0.01
        for: 5m
        labels:
          severity: critical
          category: payments
        annotations:
          summary: "Payment processing failures detected"
          description: "Payment failure rate is {{ $value }}/s"

      # Email delivery failures
      - alert: EmailDeliveryFailures
        expr: |
          (
            sum(rate(email_delivery_failed_total[5m]))
            /
            sum(rate(email_delivery_total[5m]))
          ) > 0.05
        for: 10m
        labels:
          severity: warning
          category: email
        annotations:
          summary: "High email delivery failure rate"
          description: "Email failure rate is {{ $value | humanizePercentage }} (threshold: 5%)"

      # Container restarts
      - alert: ContainerRestarting
        expr: |
          rate(kube_pod_container_status_restarts_total[15m]) > 0
        for: 5m
        labels:
          severity: warning
          category: containers
        annotations:
          summary: "Container {{ $labels.container }} is restarting"
          description: "Container in pod {{ $labels.pod }} has restarted {{ $value }} times in the last 15 minutes"

      # PVC usage
      - alert: PersistentVolumeClaimFillingUp
        expr: |
          (kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes) * 100 > 80
        for: 5m
        labels:
          severity: warning
          category: storage
        annotations:
          summary: "PVC {{ $labels.persistentvolumeclaim }} is filling up"
          description: "PVC usage is {{ $value | humanize }}% (threshold: 80%)"
